# Host Nginx for https://cargos.pro (no Docker).
# Install: sudo cp deploy/nginx/cargos.pro.conf /etc/nginx/sites-available/cargos.pro
#          sudo ln -s /etc/nginx/sites-available/cargos.pro /etc/nginx/sites-enabled/
# Then:    sudo certbot --nginx -d cargos.pro

upstream cargos_api {
  server 127.0.0.1:3000;
}

upstream cargos_web {
  server 127.0.0.1:4173;
}

upstream cargos_mcp {
  server 127.0.0.1:3100;
}

server {
  listen 80;
  listen [::]:80;
  server_name cargos.pro;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name cargos.pro;

  # certbot --nginx fills these in
  ssl_certificate /etc/letsencrypt/live/cargos.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cargos.pro/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 20m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://cargos_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /mcp {
    proxy_pass http://cargos_mcp/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    chunked_transfer_encoding on;
  }

  location / {
    proxy_pass http://cargos_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
